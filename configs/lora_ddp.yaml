# 独立双卡备选；不改变 configs/lora.yaml 或单卡训练入口。
schema_version: 1
seed: 20261104
distributed:
  backend: gloo
  devices: [cuda:0, cuda:1]
  timeout_seconds: 1200
  cpu_threads_per_worker: 2
lora:
  last_n_blocks: 4
  rank: 8
  alpha: 16.0
  dropout: 0.05
  targets: [q, v]
  gradient_checkpointing: true
train:
  global_batch_groups: 4   # 两卡合计4个查询组；通常每卡累积2组，保持原单卡有效批量。
  epochs: 20
  lr: 0.0001
  weight_decay: 0.01
  temperature: 0.07
  image_batch_size: 1
  max_positives: 4
  hard_negatives: 8
  random_negatives: 4
  hard_refresh_epochs: 2
  patience: 5
  min_delta: 0.0
  amp: true
  clip_grad_norm: 1.0
  allow_tf32: false
evaluation:
  image_batch_size: 4
