# Historical profile template; use ../naviParams.example.txt for the current manual scheme.
# 单文件库配置。路径相对本配置文件；权重保持外置。
weights:
  root: ./weights
# 若文件名不同，可逐项指定绝对或相对路径：camp / convnext / dinov2 / roma / minima_roma。
# 统一配置：修改 active_profile 选择速度/精度档；修改 active_dataset 选择数据。
# 所有运行参数在 profiles 中；地图/相机在 datasets 或 infrared 中（只支持红外）。
version: 1
device: cuda
cpu_threads: 4
batch_size: 8
infrared:
  project_root: ../projects/SCC-Loc
  reference:
    georeference: auto
    image: ''
    dsm: ''
    crs: null
    origin_xy: null
    resolution_m: null
    height_datum: normal_m
    nodata: null
  camera: {}
  pose_priori: unknown
  self_eval:
    enabled: false
    min_inliers: 30
    max_reprojection_px: 4
active_profile: desert_fast
active_dataset: desert
enabled_modalities:
- 0
timing_file: logs/timing.jsonl
profiles:
  desert_fast:
    batch_size: 16
    tuning:
      initial_candidates: 2
      max_candidates: 4
      adaptive_candidates: true
      coarse_resolution: 420
      refine_resolution: 560
      upsample: true
      symmetric: true
      sample_matches: 1800
      sample_threshold: 0.05
      retrieval_overlap_percent: 50
      pre_homography_iterations: 1000
      post_homography_iterations: 1500
      homography_reprojection_px: 3.0
      geometry_confidence: 0.999
      pnp_iterations: 1000
      pnp_reprojection_px: 6.0
      refine_max_nfev: 40
      early_min_inliers: 40
      early_max_reprojection_px: 3.0
      early_min_coverage: 0.12
      early_agreement_m: 30.0
      early_require_agreement: true
      min_result_inliers: 5
      reject_weak_results: false
      resize_ratio: 0.3
      scc_crop_gain: 1.5
      anyvis_patch_scale: 1.0
      search_window_m: 600.0
      profile_timing: true
  desert_accuracy:
    batch_size: 8
    tuning:
      initial_candidates: 3
      max_candidates: 5
      adaptive_candidates: true
      coarse_resolution: 560
      refine_resolution: 864
      upsample: true
      symmetric: true
      sample_matches: 3000
      sample_threshold: 0.05
      retrieval_overlap_percent: 50
      pre_homography_iterations: 2000
      post_homography_iterations: 5000
      homography_reprojection_px: 3.0
      geometry_confidence: 0.999
      pnp_iterations: 1000
      pnp_reprojection_px: 8.0
      refine_max_nfev: null
      early_min_inliers: 40
      early_max_reprojection_px: 3.0
      early_min_coverage: 0.12
      early_agreement_m: 30.0
      early_require_agreement: true
      min_result_inliers: 5
      reject_weak_results: false
      resize_ratio: 0.3
      scc_crop_gain: 1.5
      anyvis_patch_scale: 1.0
      search_window_m: 600.0
      profile_timing: true
  baseline:
    batch_size: 8
    tuning:
      initial_candidates: 5
      max_candidates: 5
      adaptive_candidates: false
      coarse_resolution: 560
      refine_resolution: 864
      upsample: true
      symmetric: true
      sample_matches: 3000
      sample_threshold: 0.05
      retrieval_overlap_percent: 50
      pre_homography_iterations: 2000
      post_homography_iterations: 5000
      homography_reprojection_px: 3.0
      geometry_confidence: 0.999
      pnp_iterations: 1000
      pnp_reprojection_px: 8.0
      refine_max_nfev: null
      early_min_inliers: 40
      early_max_reprojection_px: 3.0
      early_min_coverage: 0.12
      early_agreement_m: 30.0
      early_require_agreement: true
      min_result_inliers: 5
      reject_weak_results: false
      resize_ratio: 0.3
      scc_crop_gain: 1.5
      anyvis_patch_scale: 1.0
      search_window_m: 600.0
      profile_timing: true
datasets:
  dataset1_demo:
    enabled_modalities:
    - 0
    allow_unverified_height_datum: true
    infrared:
      project_root: ../projects/SCC-Loc
      reference:
        image: ./maps/example/satellite.tif
        dsm: ./maps/example/dsm.tif
        crs: EPSG:32649
        origin_xy:
        - 694811.6077
        - 3130673.5115
        resolution_m: 0.3
        image_origin_xy:
        - 694811.6076989954
        - 3130673.5114987087
        image_resolution_xy:
        - 0.29999799077170775
        - 0.300002581922929
        nodata: 0
        height_datum: unverified_m
      camera:
        K:
        - - 2001.0577474459524
          - 0
          - 640.0
        - - 0
          - 2001.0577474459524
          - 512.0
        - - 0
          - 0
          - 1
        image_size:
        - 1280
        - 1024
        optical_axis_in_inns:
        - 1
        - 0
        - 0
        frame_agl_file: data/dataset1_frame_agl.json
      pose_priori: yp
      self_eval:
        enabled: false
        min_inliers: 30
        max_reprojection_px: 4
  desert:
    enabled_modalities:
    - 0
    allow_unverified_height_datum: false
_help:
  active_profile: desert_fast=速度优先起点；desert_accuracy=保留更多细节和候选；baseline=原参数对照
  active_dataset: dataset1_demo 是城市/乡村红外演示数据，非沙漠验证；部署沙漠数据时选 desert 并填写上方 infrared
    的地图和相机。
  candidate_budget: 先处理 initial_candidates；几何质量和两候选位置一致性不足时，继续到 max_candidates。不会偷偷变更权重。
  coarse_resolution: 必须为14的倍数。降低会加速，但可能损失沙漠弱纹理细节。
  refine_resolution: 必须为8的倍数。不应低于 coarse_resolution。
  search_window_m: 以输入位置先验为中心的正方形地图边长（米）；先验误差大时请增大，不能只为速度缩小。
  sampling: sample_matches 控制几何估计匹配点数；sample_threshold 是 RoMa 采样权重饱和阈值，不是输出置信度。
  self_eval: 仍为未标定的0；early_*只决定是否继续搜索，不代表真实定位误差合格。
  logging: 每帧记录 prepare/retrieval/dense_match/pose/filter耗时和候选数量到 timing_file。
  reload: 修改配置后重新初始化/重启调用程序；NAV_PROFILE、NAV_DATASET 可临时覆盖选择，不复制调参文件。
