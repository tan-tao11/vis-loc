# 精简 MLP 配置：只列出需要填写或常调的项，其余全部继承 train.yaml（base）。
# 推荐流程：scripts/run_mlp.ps1 -EnvDir <环境> -Config configs/mlp.yaml
base: train.yaml
output: artifacts/mlp          # 每次实验换一个新目录；manifest/特征/训练结果都在这里

data:
  root: 'D:/SCC_data'
  per_image_txt: true
  mapping_confirmed: false      # 核对 mapping_report 后置 true
  groups:                       # 只用垂直视角（整体替换 train.yaml 的四组）
    DV: {directory: day/IR/vertical, records: day_IR_vertical.txt, dayOrNight: 0, isSlant: 0, expected_isEO: 0}
    NV: {directory: night/IR/vertical, records: night_IR_vertical.txt, dayOrNight: 1, isSlant: 0, expected_isEO: 0}

geo:                            # 卫星/DSM：推理同源取图 + 真值足迹标签
  satellite: 'D:/SCC_data/maps/satellite.tif'
  dsm: 'D:/SCC_data/maps/dsm.tif'
  vertical_confirmed: false
  normal_to_ellipsoid_m: null
  dsm_to_platform_offset_m: null

pose:
  calibration_confirmed: false

preprocess:
  deployment_confirmed: false

# ↓↓ 与部署 naviParams.txt 的 infrared 段逐项相同（照抄部署值）。候选块由推理原代码生成。
inference:
  pose_priori: yp
  retrieval_overlap_percent: 50
  reference:
    window_m: 600               # 部署的 reference.window_m（启用 profile 时为 search_window_m）
    image_bands: [1, 1, 1]
    image_value_range: null     # 非 uint8 卫星必填，例如 [0, 4095]；填错会使候选图全白
  camera:
    reference_window_scale: 1.2
    # 垂直视角(非EO)必须为 true：yaw=innsYaw；要求 sensor 角与 INS pitch/roll 均在 1° 内，否则该帧失败
    nadir_reference_alignment: true
  camera_by_group: {}           # 部署对垂直组(DV/NV)另有设置时在此按组覆盖

candidates:
  window_mode: meters           # = 推理 prior_tracking.window_mode（meters：固定米数；blocks：固定块数）
  train_window_m: 2000          # meters：训练集搜索窗边长（负例数已由 train_negatives 封顶；越大读图越慢）
  eval_window_m: 4000           # meters：验证/测试 = 推理 prior_tracking.max_window_m
  train_max_blocks: 100         # blocks：训练集每帧块数
  eval_max_blocks: 100          # blocks：验证/测试 = 推理 prior_tracking.max_blocks
  center_offset_m: 300          # 搜索中心 = 真值 + ≤300 m 随机偏移
  altitude_error_m: 100         # 高度 = 真值 ±100 m，块尺寸随之偏差
  train_negatives: 128          # 训练集每查询：全部正例 + 128 个负例（一半最近、一半随机）
  eval_query_stride: 5          # 验证/测试每条序列每 5 帧取 1 帧
  train_query_stride: 3         # 训练集每 3 帧取 1 帧：首轮快速出结果；全量训练改为 1

split:
  mode: sequence
  regions_geojson: null
  sequence_splits:              # 覆盖实际出现的全部序列名
    sequence1: train
    sequence2: train
    sequence3: val
    sequence4: test

extract:
  batch_size: 32                # A4000 16 GB；显存不足会自动减半

model:
  checkpoint: 'D:/SCC_Loc/weights/dinov2_vitl14_pretrain.pth'
  checkpoint_sha256: d5383ea8f4877b2472eb973e0fd72d557c7da5d3611bd527ceeb1d7162cbf428
