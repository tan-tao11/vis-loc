# 路径相对本工程根目录；真实数据尚未提供。不要把 bice 样例复制到全序列。
schema_version: 1
seed: 20261104
synthetic: false
output: artifacts/real
data:
  root: data
  # auto 只识别明确的 CSV 表头或 key=value 多帧块，无法识别时中止。
  record_format: auto
  mapping_confirmed: false
  image_regex: '(?P<sequence>sequence[^/]+)/(?P<frame>\d+)\.(?:png|jpg|jpeg|tif|tiff)$'
  # 多帧 TXT 没有 sequence 时必须配置文件到 sequence 的显式映射。
  sequence_by_file: {}
  per_image_txt: false
  groups:
    DS: {directory: day/IR/slant, records: day_IR_slant.txt, dayOrNight: 0, isSlant: 1, expected_isEO: 1}
    DV: {directory: day/IR/vertical, records: day_IR_vertical.txt, dayOrNight: 0, isSlant: 0, expected_isEO: 0}
    NS: {directory: night/IR/slant, records: night_IR_slant.txt, dayOrNight: 1, isSlant: 1, expected_isEO: 1}
    NV: {directory: night/IR/vertical, records: night_IR_vertical.txt, dayOrNight: 1, isSlant: 0, expected_isEO: 0}
geo:
  satellite: null
  dsm: null
  # error/embedded/sidecar；冲突默认报错，报告两套变换和 CRS。
  authority: error
  dsm_authority: error
  vertical_confirmed: false
  platform_datum: normal_height_unconfirmed
  dsm_datum: unknown
  dsm_unit_to_m: 1.0
  dsm_to_platform_offset_m: null
  # 正常高转椭球高用于 ECEF 射线；仅可填写已核验的局部高程异常值。
  normal_to_ellipsoid_m: null
  flat_fallback: false
  flat_ground_normal_m: null
  ray_step_m: 10.0
  max_ray_m: 30000.0
  boundary_samples_per_edge: 12
pose:
  calibration_confirmed: false
  version: candidate_axes_v1_UNCONFIRMED
  # 列向量、主动旋转、NED；ZYX 欧拉顺序尚待标定核验。
  euler_order: ZYX
  eo_inns_from_cam: [[0, 0, 1], [1, 0, 0], [0, 1, 0]]
  inns_from_mount: [[0, 0, -1], [0, 1, 0], [1, 0, 0]]
  sensor_from_cam: [[0, 0, 1], [1, 0, 0], [0, 1, 0]]
preprocess:
  deployment_confirmed: false
  size: 336                       # 查询：中心正方形裁剪 + PIL BICUBIC；候选：cv2 LINEAR（同推理）
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  intensity:
    ir: {uint8: [0, 255], uint16: null, float: null, nodata: null}
    satellite: {uint8: [0, 255], uint16: null, float: null, nodata: null}  # 仅 validate_geometry 叠加图使用
  intrinsics_override: null
  distortion: null
# 与部署 naviParams.txt 的 infrared 段保持一致：同名字段直接照抄部署值。
# 候选块完全按推理生成（同一地图网格/搜索窗/旋转/块尺寸/重叠/黑边过滤），见 scc_inference.py。
inference:
  pose_priori: yp                 # infrared.pose_priori
  retrieval_overlap_percent: 50   # tuning.retrieval_overlap_percent
  reference:                      # infrared.reference（image/dsm 取自上面的 geo.satellite / geo.dsm）
    georeference: auto
    window_m: 600                 # reference.window_m；启用 profile 时填 search_window_m
    image_bands: [1, 1, 1]
    image_value_range: null       # 非 uint8 卫星必填，与部署一致
    # working_crs / resolution_m / nodata / image_tfw / image_prj 等按部署值照填
  camera:                         # infrared.camera
    reference_window_scale: 1.2
    nadir_reference_alignment: false
    # optical_axis_in_inns: [0, 0, 1]
  camera_by_group: {}             # 可选：按组覆盖 camera，如 DV: {optical_axis_in_inns: [0, 0, 1]}
  # infrared.prior_tracking（scc_prior.py = 推理 prior_tracker.py）：先验每帧独立误差可达 2-3 海里、高度 ±200 m。
  # 验证/测试按序列因果平滑先验（推理的捕获阶段，离线没有定位结果所以不进入跟踪），搜索窗由跟踪器给出。
  prior_tracking: {enabled: true, prior_error_m: 5600, altitude_error_m: 200, history: 30,
                   min_window_m: 600, max_window_m: 2000, min_fix_inliers: 40}
candidates:
  train_window_m: null            # 训练集搜索窗边长；null=reference.window_m。验证/测试用推理的窗口
  train_center_offset_m: 300      # 训练集：搜索中心=真值位置+随机偏移(圆内均匀)，模拟跟踪后的残差
  train_altitude_error_m: 100     # 训练集：高度=真值±均匀误差（≈平滑后残差），使块尺寸像推理一样有偏差
  train_negatives: null           # 训练集每查询保留全部正例+N个负例；null=全部
  eval_query_stride: 1            # 验证/测试每条序列每k帧取1帧
labels:
  positive_coverage: 0.8
  negative_coverage: 0.05
  max_area_ratio: 4.0
  max_center_distance_ratio: 1.0
split:
  # 手工地理多边形 GeoJSON，属性 split=train/val/test，CRS 为卫星 CRS。
  regions_geojson: null
  buffer_m: 200
  sequence_exclusive: true
model:
  source: vendor/dinov2
  checkpoint: weights/dinov2_vitl14_pretrain.pth
  name: dinov2_vitl14
  source_commit: '7764ea0f912e53c92e82eb78a2a1631e92725fc8'
  checkpoint_sha256: d5383ea8f4877b2472eb973e0fd72d557c7da5d3611bd527ceeb1d7162cbf428
  deployed_backbone_confirmed: false
  input_dim: 1024
  hidden_dim: 512
  output_dim: 512
  dropout: 0.0
  gem_p: 4.0
extract:
  batch_size: 8
  amp: true
  retries: 2
train:
  device: cuda:0
  epochs: 50
  batch_size: 8
  lr: 0.001
  weight_decay: 0.01
  temperature: 0.07
  patience: 8
  scheduler: cosine
  hard_negative_count: 64
  hard_refresh_epochs: 2
  # 当前实现严格的单向组内多正样本损失，无隐含跨帧负例。
  loss: grouped_multi_positive
