# sequence 划分的完整参考配置：只写与 train.yaml 不同的项，其余继承（推荐改用更精简的 configs/mlp.yaml）。
# 路径为示例，请填写实际位置；未知高程转换和未确认标志保留原值。旧 manifest / 特征缓存不能直接复用。
base: train.yaml
output: artifacts/real_sequence
data:
  root: 'D:/SCC_data'
  per_image_txt: true
geo:
  satellite: 'D:/SCC_data/maps/satellite.tif'
  dsm: 'D:/SCC_data/maps/dsm.tif'
split:
  mode: sequence
  # 此模式不需要区域 GeoJSON；同名 sequence 在四类数据中保持同一划分。
  # 以下只是示例：覆盖实际出现的所有序列名，数量可以因类别而不同。
  sequence_splits:
    sequence1: train
    sequence2: train
    sequence3: val
    sequence4: test
